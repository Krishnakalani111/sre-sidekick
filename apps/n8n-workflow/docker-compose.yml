# NL -> SQL: n8n + a real Postgres (seeded) + Gemini
#
# Brings up a real Postgres loaded with a small sample dataset, and n8n to
# run the nl2sql workflow against it. Copy .env.example to .env in this
# directory and set GEMINI_API_KEY before starting.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nl2sql
      POSTGRES_USER: nl2sql
      POSTGRES_PASSWORD: nl2sql
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nl2sql"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    ports: ["5680:5678"]
    environment:
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: http://localhost:5680/
      GENERIC_TIMEZONE: Asia/Kolkata
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  n8n_data:
