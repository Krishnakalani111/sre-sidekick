# Full app stack for the AI SRE Sidekick — one compose to rule them all.
#
#   docker compose up -d                         # postgres + backend + frontend (dashboard)
#   docker compose --profile slack up -d         # + Slack bot
#   docker compose --profile n8n up -d           # + n8n NL->SQL workflow (+ its seeded postgres)
#   docker compose --profile slack --profile n8n up -d   # everything
#
# Reads secrets from a repo-root .env (gitignored): SIGNOZ_API_KEY, GEMINI_API_KEY
# or XAI_API_KEY, SLACK_*, DEEPGRAM_API_KEY. With none set, the backend runs in mock mode.
#
# SigNoz + the SigNoz MCP server are deployed separately via Foundry (deploy/signoz),
# which creates the `signoz-network`. The backend and n8n JOIN that external network
# and reach SigNoz by service name (signoz-mcp-server:8000, signoz-ingester:4318), so
# SigNoz must be up FIRST (foundryctl cast) before `docker compose up`.
services:
  postgres:
    image: postgres:16
    container_name: sidekick-postgres
    environment:
      POSTGRES_USER: sidekick
      POSTGRES_PASSWORD: sidekick
      POSTGRES_DB: sidekick
    ports:
      - "5432:5432"
    volumes:
      - sidekick-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidekick -d sidekick"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: sidekick-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKEND_PORT: 3000
      DATABASE_URL: postgres://sidekick:sidekick@postgres:5432/sidekick
      # Reached over the shared signoz-network by service name. Override MCP_URL
      # if the MCP server runs elsewhere.
      MCP_SERVER_URL: ${MCP_URL:-http://signoz-mcp-server:8000/mcp}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      SIGNOZ_API_KEY: ${SIGNOZ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-grok-2-latest}
      INVESTIGATION_MAX_STEPS: ${INVESTIGATION_MAX_STEPS:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      DEEPGRAM_LANGUAGE: ${DEEPGRAM_LANGUAGE:-multi}
      # Outbound Slack notifications (POST /notify/slack). Without a token those
      # endpoints return 503; everything else keeps working.
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_DEFAULT_CHANNEL: ${SLACK_DEFAULT_CHANNEL:-}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - signoz-network
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: sidekick-frontend
    depends_on:
      - backend
    ports:
      - "5173:80" # 8080 is taken by the SigNoz UI
    restart: unless-stopped

  slack-bot:
    build:
      context: ./apps/slack-bot
      dockerfile: Dockerfile
    container_name: sidekick-slack-bot
    profiles: ["slack"]
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:3000
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      USE_MOCK_BACKEND: ${USE_MOCK_BACKEND:-0}
    restart: unless-stopped

  # ---- n8n NL->SQL workflow (opt-in: --profile n8n) --------------------------
  # A seeded Postgres for the NL->SQL demo (separate from the sidekick DB), plus
  # n8n. In the n8n Postgres credential, use host `nl2sql-postgres`, port 5432.
  nl2sql-postgres:
    image: postgres:16-alpine
    container_name: sidekick-nl2sql-postgres
    profiles: ["n8n"]
    environment:
      POSTGRES_DB: nl2sql
      POSTGRES_USER: nl2sql
      POSTGRES_PASSWORD: nl2sql
    ports:
      - "5433:5432" # 5432 is taken by the sidekick postgres
    volumes:
      - ./apps/n8n-workflow/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - nl2sql-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nl2sql"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: sidekick-n8n
    profiles: ["n8n"]
    depends_on:
      nl2sql-postgres:
        condition: service_healthy
    environment:
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: http://localhost:5680/
      GENERIC_TIMEZONE: Asia/Kolkata
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      N8N_OTEL_ENABLED: "true"
      # n8n's workflow-execution traces -> SigNoz OTLP ingester on signoz-network.
      # PRODUCTION_ONLY=false so manual/test executions also emit spans.
      N8N_OTEL_EXPORTER_OTLP_ENDPOINT: http://signoz-ingester:4318
      N8N_OTEL_TRACES_PRODUCTION_ONLY: "false"
    ports:
      - "5680:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - default
      - signoz-network
    restart: unless-stopped

networks:
  default: {}
  signoz-network:
    external: true
    name: signoz-network

volumes:
  sidekick-pgdata:
    name: sidekick-pgdata
  nl2sql-pgdata:
    name: sidekick-nl2sql-pgdata
  n8n-data:
    name: sidekick-n8n-data
